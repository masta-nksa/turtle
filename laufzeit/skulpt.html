<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle-Laufzeit</title>
<style>
  /* durchsichtig: Kacheln und Koordinatensystem der Seite liegen darunter */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* Leinwand 1500 × 1500 (Welt −750 … 750); sichtbar ist ein Ausschnitt um die Mitte,
     per transform auf die Breite des Feldes skaliert */
  #turtle { width: 1500px; height: 1500px; transform-origin: 0 0; outline: none; }
</style>
</head>
<body>
<div id="turtle"></div>

<script src="../vendor/skulpt.min.js"></script>
<script src="../vendor/skulpt-stdlib.js"></script>
<script>
/* Läuft in einem Sandbox-iframe ohne eigenen Ursprung: Der Schülercode sieht
   weder die gespeicherten Programme noch die Seite darum herum.
   Nachrichten von der Seite:  start {code, faktor} · pause · weiter · tempo {faktor} · eingabe {text} · fokus
   Nachrichten an die Seite:   bereit · aus {text} · eingabe {prompt} · fertig {zeichnung, wartet}
                               · fehler {text, art, nachricht, stapel} · ansicht {groesse} · position {x, y, ausserhalb}
                               · maus {fx, fy, touch} | {weg}
   zeichnung: Strecken mit gesenktem Stift, Punkte (dot) und Füllflächen, für die Prüfung im Kurs.
   wartet: Das Programm hat Tasten, Klicks oder einen Timer angemeldet und läuft darum weiter (Spiele).
   Zurücksetzen entfernt das ganze iframe; ein eigener Stopp ist darum nicht nötig. */
(function () {
  "use strict";
  var FELD = 500, LEINWAND = 1500;   // sichtbares Grundfeld, grösste Ansicht (Welteinheiten)
  var feld = document.getElementById("turtle");
  var faktor = 1, pausiert = false, warten = [], eingabeFertig = null, ereignisse = false;

  function senden(m) { parent.postMessage(m, "*"); }

  // Ansicht: wie viele Welteinheiten die Breite des Feldes zeigt. Verlässt die Turtle den
  // Ausschnitt, zoomt die Ansicht weich heraus (höchstens bis zur ganzen Leinwand).
  var ansicht = FELD, ziel = FELD, zoomStart = 0, zoomVon = FELD, zoomLaeuft = false;
  function ansichtAnwenden() {
    var s = window.innerWidth / ansicht, t = window.innerWidth / 2 - LEINWAND / 2 * s;
    feld.style.transform = "translate(" + t + "px," + t + "px) scale(" + s + ")";
    senden({ typ: "ansicht", groesse: ansicht });
  }
  function zoomSchritt(jetzt) {
    var a = Math.min(1, (jetzt - zoomStart) / 350), w = 1 - Math.pow(1 - a, 3);
    ansicht = zoomVon + (ziel - zoomVon) * w;
    ansichtAnwenden();
    if (a < 1) requestAnimationFrame(zoomSchritt); else zoomLaeuft = false;
  }
  function zoomen(neu) {
    if (neu <= ziel) return;
    ziel = neu; zoomVon = ansicht; zoomStart = performance.now();
    if (!zoomLaeuft) { zoomLaeuft = true; requestAnimationFrame(zoomSchritt); }
  }
  window.addEventListener("resize", ansichtAnwenden);

  // Zeiger über dem Feld: Anteil der Breite/Höhe an die Seite (sie rechnet mit der Ansicht um)
  function zeiger(e) {
    senden({ typ: "maus", fx: e.clientX / window.innerWidth, fy: e.clientY / window.innerHeight, touch: e.pointerType === "touch" });
  }
  document.addEventListener("pointermove", zeiger);
  document.addEventListener("pointerdown", zeiger);
  document.documentElement.addEventListener("pointerleave", function (e) {
    if (e.pointerType !== "touch") senden({ typ: "maus", weg: true });   // beim Finger blendet die Seite selbst aus
  });
  ansichtAnwenden();

  // Jede Bewegung meldet ihr Ziel: Ansicht anpassen, Position an die Seite (einmal pro Bild)
  var position = null, positionGemeldet = true;
  function bewegt(x, y) {
    var noetig = 2 * Math.max(Math.abs(x), Math.abs(y)) + 40;
    if (noetig > ziel) zoomen(Math.min(LEINWAND, Math.ceil(noetig / 100) * 100));
    position = { typ: "position", x: x, y: y, ausserhalb: Math.max(Math.abs(x), Math.abs(y)) > LEINWAND / 2 };
    if (positionGemeldet) {
      positionGemeldet = false;
      requestAnimationFrame(function () { positionGemeldet = true; senden(position); });
    }
  }

  // Gezeichnetes für die Prüfung: nur Strecken mit gesenktem Stift (Kreise kommen als kurze
  // Strecken), Punkte und Füllflächen. clear() und reset() leeren die Liste der betroffenen Turtle.
  var MAX_TEILE = 200000, zeichnung = { strecken: [], punkte: [], flaechen: [], voll: false }, turtleNr = 0;
  function farbe(f) {
    if (Array.isArray(f)) return (f.length > 3 ? "rgba(" : "rgb(") + f.slice(0, 4).join(",") + ")";
    return String(f);
  }
  function nummer(t) { if (!t.__nr) t.__nr = ++turtleNr; return t.__nr; }
  function platz() {
    var z = zeichnung, n = z.strecken.length + z.punkte.length + z.flaechen.length;
    if (n >= MAX_TEILE) z.voll = true;
    return !z.voll;
  }
  function strecke(t, x1, y1, x2, y2) {
    if (t._filling && t.__flaeche) t.__flaeche.push([x2, y2]);
    if (!t._down || (x1 === x2 && y1 === y2) || !platz()) return;
    zeichnung.strecken.push([x1, y1, x2, y2, farbe(t._color), t._size, nummer(t)]);
  }
  function punkt(t, groesse, f) {
    if (platz()) zeichnung.punkte.push([t._x, t._y, groesse, farbe(f), nummer(t)]);
  }
  function fuellen(t, an) {
    if (an) { t.__flaeche = [[t._x, t._y]]; return; }
    var p = t.__flaeche; t.__flaeche = null;
    if (p && p.length > 2 && platz()) zeichnung.flaechen.push({ punkte: p, farbe: farbe(t._fill), nr: nummer(t) });
  }
  function leeren(t) {
    if (!t) { zeichnung.strecken = []; zeichnung.punkte = []; zeichnung.flaechen = []; return; }
    var nr = nummer(t);
    zeichnung.strecken = zeichnung.strecken.filter(function (s) { return s[6] !== nr; });
    zeichnung.punkte = zeichnung.punkte.filter(function (s) { return s[4] !== nr; });
    zeichnung.flaechen = zeichnung.flaechen.filter(function (s) { return s.nr !== nr; });
  }
  function zeichnungMelden() {
    return {
      strecken: zeichnung.strecken.map(function (s) { return s.slice(0, 6); }),
      punkte: zeichnung.punkte.map(function (s) { return s.slice(0, 4); }),
      flaechen: zeichnung.flaechen.map(function (f) { return { punkte: f.punkte, farbe: f.farbe }; }),
      voll: zeichnung.voll
    };
  }

  // Tempo-Regler: Der Faktor wirkt auf die Geschwindigkeit, die das Programm mit speed() wählt.
  // speed(0) bleibt sofort; Faktor Infinity zeichnet jeden Schritt ohne Zwischenbilder.
  function tempo(s) {
    if (!s || faktor === 1) return s;
    if (faktor === Infinity) return 0;
    return s * faktor;
  }

  // Kleine Eingriffe ins Turtle-Modul von Skulpt (Quelltext in skulpt-stdlib.js):
  // 1. Bewegungen und Drehungen fragen den Tempo-Faktor ab.
  // 2. Mausklicks rechnen Zoom und Skalierung des Feldes heraus.
  // 3. Jede Bewegung meldet ihr Ziel (für Zoom und Koordinatenanzeige).
  // 4. «from turtle import *» bietet auch bgcolor, listen, onkey … an wie in Python
  //    (setup und setworldcoordinates bewusst nicht: Sie vertragen sich nicht mit dem Zoom).
  // 5. Strecken, Punkte und Füllflächen werden für die Prüfung gesammelt.
  // 6. Tasten, Klicks und Timer: Das Programm läuft nach dem Ende weiter; Pause hält auch diese
  //    Aufrufe an, und ihre Fehler werden gemeldet. listen() gibt dem Feld gleich den Fokus
  //    (sonst wirken Tasten erst nach einem Klick ins Feld).
  // 7. Farben wie color(0, 255, 127) ohne colormode(255): Ist ein Wert grösser als 1, gilt
  //    0 … 255 (so hat es Trinket gehalten); color(1, 1, 1) bleibt Weiss wie in Python.
  (function anpassen() {
    var pfad = "src/lib/turtle.js", q = Sk.builtinFiles.files[pfad];
    var ersatz = [
      ["function translate(e,a,l,o,d,_,c){", "function translate(e,a,l,o,d,_,c){Sk.TurtleGraphics.bewegt(a+o,l+d);Sk.TurtleGraphics.strecke(e,a,l,a+o,l+d);"],
      ["this.addUpdate(drawDot,!0,void 0,e,t)", "(Sk.TurtleGraphics.punkt(this,e,t),this.addUpdate(drawDot,!0,void 0,e,t))"],
      ["e===this._filling)?void 0:(this._filling=e,", "e===this._filling)?void 0:(Sk.TurtleGraphics.fuellen(this,e),this._filling=e,"],
      ["e.$clear=function(){return this.addUpdate(", "e.$clear=function(){return Sk.TurtleGraphics.leeren(this),this.addUpdate("],
      ["e.$reset=e.$resetscreen=function(){var e=this,", "e.$reset=e.$resetscreen=function(){Sk.TurtleGraphics.leeren(null);var e=this,"],
      ["Sk.misceval.applyAsync(void 0,e,", "Sk.misceval.applyAsync({\"*\":Sk.TurtleGraphics.unterbrechung},e,"],
      ["e.$onkey=function(e,t){", "e.$onkey=function(e,t){Sk.TurtleGraphics.ereignis();"],
      ["e.$listen=function(){this._createKeyUpListener(),", "e.$listen=function(){focusTurtle(!0),this._createKeyUpListener(),"],
      ["e.$ontimer=function(e,t){", "e.$ontimer=function(e,t){Sk.TurtleGraphics.ereignis();"],
      ["e.$onscreenclick=function(e,t,r){", "e.$onscreenclick=function(e,t,r){Sk.TurtleGraphics.ereignis();"],
      ["e.$onclick=function(e,t,r){", "e.$onclick=function(e,t,r){Sk.TurtleGraphics.ereignis();", true],
      ["t.constructor===Array&&t.length){if(255===e){", "t.constructor===Array&&t.length){if(255===e||Sk.TurtleGraphics.ueber1(t)){"],
      ["var u,m=e._computed_speed,", "var u,m=Sk.TurtleGraphics.tempo(e._computed_speed),"],
      ['addModuleMethod(Screen,y,"$title",getScreen),', 'addModuleMethod(Screen,y,"$title",getScreen),' +
        ["bgcolor", "bgpic", "exitonclick", "listen", "onkey", "onscreenclick", "ontimer", "clearscreen",
         "resetscreen", "register_shape", "addshape", "getshapes", "turtles"].map(function (n) {
          return 'addModuleMethod(Screen,y,"$' + n + '",getScreen),';
        }).join("")],
      ["var o,d=e._computed_speed,", "var o,d=Sk.TurtleGraphics.tempo(e._computed_speed),"],
      ["e=0|r.clientX-l.left,n=0|r.clientY-l.top",
       "e=0|(r.clientX-l.left)*t.spriteLayer().canvas.width/l.width,n=0|(r.clientY-l.top)*t.spriteLayer().canvas.height/l.height"]
    ];
    ersatz.forEach(function (paar) {
      if (q.indexOf(paar[0]) < 0) { console.warn("Turtle-Anpassung nicht gefunden:", paar[0]); return; }
      q = paar[2] ? q.split(paar[0]).join(paar[1]) : q.replace(paar[0], paar[1]);
    });
    Sk.builtinFiles.files[pfad] = q;
  })();

  function lesen(name) {
    if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[name] === undefined)
      throw "Datei nicht gefunden: '" + name + "'";
    return Sk.builtinFiles.files[name];
  }

  // Jede Unterbrechung des Programms (Zeichnen, input, regelmässiges Abgeben an den Browser)
  // läuft hier durch: Bei Pause wartet das Programm, bis «Weiter» kommt.
  function unterbrechung(susp) {
    if (pausiert) return new Promise(function (ja) { warten.push(function () { ja(susp); }); });
  }

  // Fehler in Aufrufen durch Tasten, Klicks oder Timer (laufen nach dem Hauptprogramm)
  function fehlerMelden(err) {
    var stapel = (err && err.traceback || []).map(function (t) { return t.lineno; });
    var nachricht = "";
    try { nachricht = err.args && err.args.v && err.args.v.length ? String(err.args.v[0]) : ""; } catch (e) { /* weiter */ }
    senden({ typ: "fehler", text: String(err), art: (err && err.tp$name) || "", nachricht: nachricht, stapel: stapel });
  }

  function start(code) {
    Sk.configure({
      output: function (t) { senden({ typ: "aus", text: t }); },
      read: lesen,
      inputfun: function (prompt) {
        return new Promise(function (ja) {
          eingabeFertig = ja;
          senden({ typ: "eingabe", prompt: prompt || "" });
        });
      },
      inputfunTakesPrompt: true,
      __future__: Sk.python3,
      yieldLimit: 50
    });
    Sk.TurtleGraphics = {
      target: "turtle", width: LEINWAND, height: LEINWAND, tempo: tempo, bewegt: bewegt,
      strecke: strecke, punkt: punkt, fuellen: fuellen, leeren: leeren,
      unterbrechung: unterbrechung, ereignis: function () { ereignisse = true; },
      ueber1: function (t) { return t.slice(0, 3).some(function (x) { return typeof x === "number" && x > 1; }); }
    };
    Sk.uncaughtException = fehlerMelden;

    Sk.misceval.asyncToPromise(function () {
      return Sk.importMainWithBody("<stdin>", false, code, true);
    }, { "*": unterbrechung }).then(function () {
      senden({ typ: "fertig", zeichnung: zeichnungMelden(), wartet: ereignisse });
    }, fehlerMelden);
  }

  window.addEventListener("message", function (e) {
    if (e.source !== parent || !e.data) return;
    var m = e.data;
    if (m.typ === "start" && typeof m.code === "string") { faktor = m.faktor; start(m.code); }
    else if (m.typ === "tempo") faktor = m.faktor;
    else if (m.typ === "fokus") feld.focus({ preventScroll: true });   // Tasten wirken sofort, ohne zuerst ins Feld zu klicken
    else if (m.typ === "pause") pausiert = true;
    else if (m.typ === "weiter") { pausiert = false; var w = warten; warten = []; w.forEach(function (f) { f(); }); }
    else if (m.typ === "eingabe" && eingabeFertig) { var f = eingabeFertig; eingabeFertig = null; f(String(m.text)); }
  });
  senden({ typ: "bereit" });
})();
</script>
</body>
</html>
